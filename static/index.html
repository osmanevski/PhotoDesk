<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhotoDesk</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png?v={{v:favicon.png}}">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg?v={{v:icon.svg}}">
<link rel="stylesheet" href="/static/style.css?v={{v:style.css}}">
<script type="application/json" id="strings">{{strings}}</script>
<script nonce="{{token}}">window.APP_TOKEN='{{token}}';window.APP_LANGUAGE='{{lang}}';
try{var theme=localStorage.getItem('fm-theme');if(theme==='light'||theme==='dark')document.documentElement.dataset.theme=theme;}catch(e){}</script>
<script src="/static/app.js?v={{v:app.js}}" defer></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><img src="/static/icon.svg?v={{v:icon.svg}}" alt=""><span>PhotoDesk</span></a>
  <div class="batch-switch" id="batchSwitch"></div>
  <div class="top-status" id="modelState"></div>
  <button id="themeToggle" class="theme-btn" type="button"></button>
  <select id="languageSelect" class="lang" aria-label="Language / Dil"><option value="en">EN</option><option value="tr">TR</option></select>
  <button id="exportTop" class="btn primary" disabled>{{t:export.open}}</button>
</header>
<div id="jobbar" class="jobbar" hidden role="status" aria-live="polite">
  <span class="spinner" aria-hidden="true"></span><span id="jobtext"></span>
  <div class="progress" id="jobprogress" hidden><i></i></div>
  <button id="cancelJob" class="btn small">{{t:job.cancel}}</button>
  <button id="dismissJob" class="icon-btn" aria-label="{{t:common.close}}">×</button>
</div>
<main id="app" class="app"></main>
<input id="fileInput" type="file" accept=".jpeg,.jpg,.png,.pdf,.tif,.tiff,.heic,.heif" multiple hidden>
<div id="dropOverlay" class="drop-overlay" hidden><div><b>{{t:drop.overlay}}</b><span>{{t:drop.formats}}</span></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<dialog id="newDialog" aria-labelledby="newTitle">
  <form id="newForm">
    <button type="button" class="icon-btn close" data-close aria-label="{{t:common.close}}">×</button>
    <h2 id="newTitle">{{t:batch.newTitle}}</h2>
    <p class="help">{{t:batch.newHelp}}</p>
    <label>{{t:batch.name}}<input id="batchName" required maxlength="150" placeholder="{{t:batch.namePlaceholder}}"></label>
    <div class="dialog-actions"><button type="button" class="btn" data-close>{{t:common.cancel}}</button><button class="btn primary" type="submit">{{t:batch.create}}</button></div>
  </form>
</dialog>

<dialog id="exportDialog" aria-labelledby="exportTitle">
  <button type="button" class="icon-btn close" data-close aria-label="{{t:common.close}}">×</button>
  <h2 id="exportTitle">{{t:export.title}}</h2>
  <p id="exportCount" class="help"></p>
  <label>{{t:export.folder}}<input id="exportDir" type="text" spellcheck="false"></label>
  <p class="help">{{t:export.folderHelp}}</p>
  <div id="exportResult" aria-live="polite"></div>
  <div class="dialog-actions"><button type="button" class="btn" data-close>{{t:common.close}}</button><button id="doExport" class="btn primary">{{t:export.run}}</button></div>
</dialog>

<dialog id="apiDialog" aria-labelledby="apiTitle">
  <button type="button" class="icon-btn close" data-close aria-label="{{t:common.close}}">×</button>
  <h2 id="apiTitle">{{t:api.title}}</h2>
  <p class="help">{{t:api.help}}</p>
  <label>{{t:api.key}}<input id="apiKey" type="password" autocomplete="new-password" placeholder="sk-or-…" spellcheck="false"></label>
  <p id="apiStatus" role="status" class="help"></p>
  <div class="dialog-actions"><button id="deleteApiKey" class="btn danger-text">{{t:api.delete}}</button><span class="grow"></span><button id="testApiKey" class="btn">{{t:api.test}}</button><button id="saveApiKey" class="btn primary">{{t:api.save}}</button></div>
  <p class="help small">{{t:api.testHelp}}</p>
</dialog>

<dialog id="confirmDialog" aria-labelledby="confirmTitle">
  <h2 id="confirmTitle"></h2>
  <p id="confirmText" class="help"></p>
  <div class="dialog-actions" id="confirmActions"></div>
</dialog>
</body>
</html>
